services:
  frontend:
    build: .
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MODEL_PATH: /app/lib/model.json
  gateway:
    image: nginx:stable-alpine
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8787:80"
