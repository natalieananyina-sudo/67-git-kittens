server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;   # пакетная загрузка до 5 МБ

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # API и документация API идут на бэкенд
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # большой файл ML-модель считает десятки секунд
    }
    location = /docs         { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }

    # Одностраничное приложение: любой адрес (/app/batch и т.д.) отдаёт index.html
    location / {
        try_files $uri /index.html;
    }
}
